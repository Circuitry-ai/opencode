name: release

# Circuitry fork release pipeline: builds CLI binaries + desktop apps (unsigned) from the
# release branch and publishes them as a GitHub Release on Circuitry-ai/opencode.
# The upstream publish.yml is guarded to anomalyco/opencode and uses their private runners.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and tag (e.g. 1.18.30-cp.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  build-cli:
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: ${{ inputs.version }}
      OPENCODE_RELEASE: ""
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun

      - name: Build CLI (darwin + linux)
        run: bun run --cwd packages/opencode script/build.ts

      - uses: actions/upload-artifact@v6
        with:
          name: cli-binaries
          path: |
            packages/opencode/dist/opencode-darwin*
            packages/opencode/dist/opencode-linux*
            packages/opencode/dist/opencode-windows*
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: --mac --arm64
          - os: macos-latest
            flags: --mac --x64
          - os: windows-latest
            flags: --win --x64
          - os: ubuntu-latest
            flags: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      OPENCODE_VERSION: ${{ inputs.version }}
      OPENCODE_RELEASE: ""
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build
        run: bun run build
        working-directory: packages/desktop

      - name: Package (unsigned)
        run: npx electron-builder ${{ matrix.flags }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          find artifacts -type f | head -40
          gh release create "v$VERSION" "artifacts/**/*" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenCode $VERSION (Circuitry)" \
            --notes "Circuitry fork build: upstream dev + enterprise patches (well-known precedence, desktop login/logout, managed MCP/skills). Unsigned builds." \
            --target "$GITHUB_SHA"